name: Windows Desktop
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies in GitHub only
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate app icon and validate JavaScript
        run: |
          python scripts/create-icon.py
          Get-ChildItem main,core,ui,test -Recurse -Include *.mjs,*.cjs | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Model, synchronization, persistence and AI tests
        run: npm test
      - name: Real Windows app interaction tests
        run: npx playwright test desktop.spec.mjs
      - name: Build installer and portable application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Install silently and test installed application
        run: |
          $installer = (Get-ChildItem dist/*Setup*.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'XingqingInstalled'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:XINGQING_PACKAGED_EXE = Join-Path $installDir '心晴3.0.exe'
          if (!(Test-Path $env:XINGQING_PACKAGED_EXE)) { throw 'Installed executable not found' }
          npx playwright test packaged.spec.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xingqing-desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-dependency-lock
          path: desktop/package-lock.json
          if-no-files-found: ignore
