name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve development signing key between builds
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: .signing/development.keystore
          key: student-schedule-explicit-signing-v2
      - name: Prepare fixed development signing key
        env:
          RESTORE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -n "$RESTORE_KEYSTORE" ]; then
            printf '%s' "$RESTORE_KEYSTORE" | base64 -d > .signing/development.keystore
          fi
          if [ ! -f .signing/development.keystore ]; then
            if [ -f scripts/signing-certificate.txt ]; then
              echo 'Signing cache missing. Restore the backed-up keystore with ANDROID_KEYSTORE_BASE64; refusing to replace the installed app identity.'
              exit 1
            fi
            keytool -genkeypair -keystore .signing/development.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ -f scripts/signing-certificate.txt ]; then
            expected=$(tr -d '\r\n' < scripts/signing-certificate.txt)
            actual=$(keytool -exportcert -keystore .signing/development.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
            test "$expected" = "$actual"
          fi
      - name: Save signing key before device cleanup
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing/development.keystore
          key: student-schedule-explicit-signing-v2
      - name: Tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug signingReport
      - name: Encrypt signing backup for the local owner
        run: bash scripts/backup-signing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-backup-api-${{ matrix.api }}
          # Only one matrix job publishes the shared signed APK and key backup.
          path: .signing-backup/*.enc
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.api == 29
        with:
          name: student-schedule-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for cloud emulator
        run: sudo chmod 666 /dev/kvm
      - name: Android device flow and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/device-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots-api-${{ matrix.api }}
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/
          if-no-files-found: ignore
